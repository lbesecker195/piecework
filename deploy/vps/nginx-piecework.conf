# nginx site for Piecework. Installed by deploy/vps/install.sh with the domain filled in.
# Install before certbot: certbot rewrites the file in place to add TLS and the 80 -> 443 redirect.
# This box serves several other sites by server_name; this is one more block beside them.

upstream piecework {
    server 127.0.0.1:4020;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name piecework.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        proxy_pass http://piecework;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Workers long-poll /v1/assignments/current for up to 30 s.
        proxy_read_timeout 90s;
    }

    client_max_body_size 1m;
}
